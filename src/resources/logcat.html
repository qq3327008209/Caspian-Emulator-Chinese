<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--vscode-editor-font-family, monospace);
    font-size: 13px;
    background: var(--vscode-editor-background);
    color: var(--vscode-editor-foreground);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .toolbar {
    display: flex; gap: 6px; padding: 6px 10px;
    background: var(--vscode-titleBar-activeBackground);
    border-bottom: 1px solid var(--vscode-panel-border);
    align-items: center; flex-shrink: 0; flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border);
    padding: 3px 8px; font-size: 12px; border-radius: 2px;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 120px; }
  .toolbar button {
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    border: none; padding: 3px 10px; cursor: pointer;
    border-radius: 2px; font-size: 12px; white-space: nowrap;
  }
  .toolbar button:hover { background: var(--vscode-button-hoverBackground); }
  .toolbar button.secondary {
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
  }
  .log-container { flex: 1; overflow-y: auto; padding: 4px 0; }
  .log-line { padding: 0 10px; white-space: pre; line-height: 1.4; }
  .log-line:hover { background: var(--vscode-list-hoverBackground); }
  .V { color: var(--vscode-terminal-ansiWhite, #ccc); }
  .D { color: var(--vscode-terminal-ansiCyan, #0cc); }
  .I { color: var(--vscode-terminal-ansiGreen, #0c0); }
  .W { color: var(--vscode-terminal-ansiYellow, #cc0); }
  .E { color: var(--vscode-terminal-ansiRed, #c00); }
  .F { color: var(--vscode-terminal-ansiMagenta, #c0c); }
  .count { font-size: 11px; color: var(--vscode-descriptionForeground); padding: 0 6px; }
</style>
</head>
<body>
  <div class="toolbar">
    <input id="search" type="text" placeholder="按标签/消息过滤或使用 /正则/..." />
    <select id="priority">
      <option value="V">详细</option>
      <option value="D">调试</option>
      <option value="I" selected>信息</option>
      <option value="W">警告</option>
      <option value="E">错误</option>
      <option value="F">致命</option>
    </select>
    <button id="btnClear">清除</button>
    <button id="btnPause">暂停</button>
    <button id="btnExport" class="secondary">导出</button>
    <label><input id="chkRegex" type="checkbox" /> 正则</label>
    <span class="count" id="lineCount">0 行</span>
  </div>
  <div class="log-container" id="logContainer"></div>
  <script>
    const vscode = acquireVsCodeApi();
    const container = document.getElementById('logContainer');
    const searchInput = document.getElementById('search');
    const prioritySelect = document.getElementById('priority');
    const lineCountEl = document.getElementById('lineCount');
    const btnPause = document.getElementById('btnPause');
    const chkRegex = document.getElementById('chkRegex');

    const priorityOrder = { V: 0, D: 1, I: 2, W: 3, E: 4, F: 5, S: 6 };
    let paused = false;
    let autoScroll = true;
    let totalLines = 0;

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    container.addEventListener('scroll', () => {
      const { scrollTop, scrollHeight, clientHeight } = container;
      autoScroll = scrollHeight - scrollTop - clientHeight < 50;
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      container.innerHTML = '';
      totalLines = 0;
      lineCountEl.textContent = '0 行';
    });

    btnPause.addEventListener('click', () => {
      paused = !paused;
      btnPause.textContent = paused ? '恢复' : '暂停';
    });

    function matchesSearch(text, search, useRegex) {
      if (!search) return true;
      if (useRegex) {
        try { return new RegExp(search, 'i').test(text); }
        catch { return text.toLowerCase().includes(search.toLowerCase()); }
      }
      if (search.startsWith('/') && search.endsWith('/') && search.length > 2) {
        try { return new RegExp(search.slice(1, -1), 'i').test(text); }
        catch { /* fall through */ }
      }
      return text.toLowerCase().includes(search.toLowerCase());
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg.type === 'logcat') {
        const minPriority = priorityOrder[prioritySelect.value] || 0;
        const search = searchInput.value;
        const useRegex = chkRegex.checked;
        const frag = document.createDocumentFragment();

        for (const entry of msg.entries) {
          if (priorityOrder[entry.priority] < minPriority) continue;
          const fullText = entry.tag + ': ' + entry.message;
          if (!matchesSearch(fullText, search, useRegex)) continue;

          const div = document.createElement('div');
          div.className = 'log-line ' + entry.priority;
          const lineText = entry.timestamp + ' ' + entry.pid + ' ' + entry.tid + ' ' + entry.priority + ' ' + entry.tag + ': ' + entry.message;
          div.textContent = lineText;
          div.title = lineText;
          frag.appendChild(div);
          totalLines++;
        }

        container.appendChild(frag);
        if (autoScroll) {
          container.scrollTop = container.scrollHeight;
        }
        lineCountEl.textContent = totalLines + ' 行';
      }
    });
  </script>
</body>
</html>
