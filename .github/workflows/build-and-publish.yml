name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-package-lock
      - run: npm run build

      - run: npm install -g @vscode/vsce
      - run: vsce package --allow-missing-repository --no-dependencies

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
          tag_name: v${{ github.event.inputs.tag || 'latest' }}
          name: ${{ github.event.inputs.tag || 'latest' }}
          body: Automated VSIX build from GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
